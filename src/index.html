<!doctype html>
<!--
  lang / dir / data-theme are the three runtime switches of the platform:
  DirectionService and LanguageService (Phase 3) rewrite lang+dir at runtime;
  ThemeService (Phase 3) rewrites data-theme. The values below are only the
  first-paint defaults.
-->
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>نظام إدارة الشحن | El Ramah Shipping</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Brand fonts of the migrated prototype screens (login): Cairo (ar) +
         Montserrat (en). Same request as the prototype's index.html. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
