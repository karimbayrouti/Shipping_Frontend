<div class="modal-overlay" role="presentation" (click)="closeFromBackdrop($event)">
  <section class="modal" role="dialog" aria-modal="true" aria-label="Employee form">
    <form [formGroup]="form" (ngSubmit)="submit()">
      <input class="input" placeholder="كود الموظف" formControlName="code" />
      <input class="input" placeholder="الاسم" formControlName="name" />
      <input class="input" placeholder="المنصب" formControlName="position" />
      <input class="input" placeholder="القسم" formControlName="department" />
      <input class="input" placeholder="الهاتف" formControlName="phone" />
      <input class="input" type="number" placeholder="صافي الراتب" formControlName="netSalary" />
      <button class="btn btn--primary" type="submit">حفظ</button>
      <button class="btn btn--ghost" type="button" (click)="closed.emit()">إلغاء</button>
    </form>
  </section>
</div>
