<div class="modal-overlay" role="presentation" (click)="closeFromBackdrop($event)">
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="employee-details-title">
    <h2 id="employee-details-title">{{ employee().name }}</h2>
    <p>{{ employee().position }} — {{ employee().department }}</p>
    <p>{{ employee().phone }}</p>
    <button class="btn btn--primary" (click)="edit.emit(employee())">تعديل</button>
    <button class="btn btn--ghost" (click)="closed.emit()">إغلاق</button>
  </section>
</div>
