<span
  class="frame"
  [style.width.px]="frameWidth()"
  [style.height.px]="height()"
  [style.border-radius.px]="radius()"
>
  <img
    src="assets/branding/logo-el-ramah.png"
    alt="El Ramah — Fast and Trust"
    [style.width.px]="imgWidth()"
    [style.height.px]="imgHeight()"
    [style.left.px]="offsetX()"
    [style.top.px]="offsetY()"
  />
</span>
